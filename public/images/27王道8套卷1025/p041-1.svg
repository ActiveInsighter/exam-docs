<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600">
  <style>
    text{font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#1a1a1a}
    .math{font-family:"Times New Roman","Noto Serif","DejaVu Serif",serif;font-style:italic}
    .ln{fill:none;stroke:#333;stroke-width:1.6}
    .t{font-size:15px}
    .h{font-size:16px;font-weight:600;text-anchor:middle}
    .d{stroke:#111;stroke-width:1.7;fill:none}
    .a{stroke:#888;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#888"/></marker>
  </defs>
  <rect width="700" height="600" fill="#fff"/>
  <line x1="210" y1="96" x2="210" y2="580" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="560" y1="96" x2="560" y2="580" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
  <text class="h" x="210" y="86">发送方</text>
  <text class="h" x="560" y="86">接收方</text>
  <text class="t" x="385.0" y="590" text-anchor="middle">时间 ↓</text>
  <text class="t" x="385.0" y="36" text-anchor="middle"><tspan class="math">T</tspan><tspan font-size="11" dy="4" class="math">f</tspan><tspan dy="-4">：一帧发送时间　　</tspan><tspan class="math">T</tspan><tspan font-size="11" dy="4" class="math">p</tspan><tspan dy="-4">：单程传播时延</tspan></text>
  <text class="t" x="200" y="115" text-anchor="end">Data0</text>
  <line class="d" x1="210" y1="110" x2="559" y2="210" marker-end="url(#ah)"/>
  <line class="a" x1="560" y1="210" x2="211" y2="270" marker-end="url(#ag)"/>
  <text class="t" x="570" y="215">ACK0</text>
  <text class="t" x="200" y="155" text-anchor="end">Data1</text>
  <line class="d" x1="210" y1="150" x2="559" y2="250" marker-end="url(#ah)"/>
  <line class="a" x1="560" y1="250" x2="211" y2="310" marker-end="url(#ag)"/>
  <text class="t" x="570" y="255">ACK1</text>
  <text class="t" x="200" y="195" text-anchor="end">Data2</text>
  <line class="d" x1="210" y1="190" x2="402.5" y2="245.0" marker-end="url(#ah)"/>
  <path d="M408.5,237.0 l14,14 m0,-14 l-14,14" stroke="#111" stroke-width="2.2"/>
  <text class="t" x="428.5" y="250.0">丢失</text>
  <text class="t" x="200" y="235" text-anchor="end">Data3</text>
  <line class="d" x1="210" y1="230" x2="559" y2="330" marker-end="url(#ah)"/>
  <line class="a" x1="560" y1="330" x2="211" y2="390" marker-end="url(#ag)"/>
  <text class="t" x="570" y="335">失序丢弃</text>
  <text class="t" x="570" y="355">重发 ACK1</text>
  <text class="t" x="200" y="355" text-anchor="end">Data2</text>
  <line class="d" x1="210" y1="350" x2="559" y2="450" marker-end="url(#ah)"/>
  <line class="a" x1="560" y1="450" x2="211" y2="510" marker-end="url(#ag)"/>
  <text class="t" x="570" y="455">ACK2</text>
  <text class="t" x="200" y="395" text-anchor="end">Data3</text>
  <line class="d" x1="210" y1="390" x2="559" y2="490" marker-end="url(#ah)"/>
  <line class="a" x1="560" y1="490" x2="211" y2="550" marker-end="url(#ag)"/>
  <text class="t" x="570" y="495">ACK3</text>
  <path d="M140,190 q-10,0 -10,10 V260.0 q0,10 -10,10 q10,0 10,10 V340 q0,10 10,10" fill="none" stroke="#333" stroke-width="1.5"/>
  <text class="t" x="112" y="264.0" text-anchor="end">超时计时器</text>
  <text class="t" x="112" y="286.0" text-anchor="end"><tspan class="math">T</tspan><tspan font-size="11" dy="4">0</tspan><tspan dy="-4"> = </tspan><tspan class="math">T</tspan><tspan font-size="11" dy="4" class="math">f</tspan><tspan dy="-4"> + 2</tspan><tspan class="math">T</tspan><tspan font-size="11" dy="4" class="math">p</tspan></text>
</svg>
