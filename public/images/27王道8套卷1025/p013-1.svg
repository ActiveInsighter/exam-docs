<svg xmlns="http://www.w3.org/2000/svg" width="560" height="96" viewBox="0 0 560 96">
  <style>
    text{font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#1a1a1a}
    .f{stroke:#222;stroke-width:1.6}
    .lab{font-size:17px;text-anchor:middle;dominant-baseline:central}
    .bit{font-size:12px;fill:#555}
  </style>
  <rect width="560" height="96" fill="#fff"/>
  <!-- 32 bits, 16.25 px per bit; x from 20 to 540 -->
  <rect class="f" x="20" y="30" width="162.5" height="44" fill="#e2e2e2"/>
  <rect class="f" x="182.5" y="30" width="162.5" height="44" fill="#efefef"/>
  <rect class="f" x="345" y="30" width="195" height="44" fill="#fafafa"/>
  <text class="lab" x="101" y="52">p1（10 位）</text>
  <text class="lab" x="264" y="52">p2（10 位）</text>
  <text class="lab" x="442" y="52">d（12 位）</text>
  <text class="bit" x="24" y="22">31</text>
  <text class="bit" x="178" y="22" text-anchor="end">22</text>
  <text class="bit" x="187" y="22">21</text>
  <text class="bit" x="341" y="22" text-anchor="end">12</text>
  <text class="bit" x="349" y="22">11</text>
  <text class="bit" x="536" y="22" text-anchor="end">0</text>
  <text class="bit" x="101" y="90" text-anchor="middle">页目录号</text>
  <text class="bit" x="264" y="90" text-anchor="middle">页号</text>
  <text class="bit" x="442" y="90" text-anchor="middle">页内偏移量</text>
</svg>
