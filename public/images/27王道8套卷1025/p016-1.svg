<svg xmlns="http://www.w3.org/2000/svg" width="630" height="290" viewBox="0 0 630 290">
  <style>
    text{font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#1a1a1a}
    .math{font-family:"Times New Roman","Noto Serif","DejaVu Serif",serif;font-style:italic}
    .ln{fill:none;stroke:#333;stroke-width:1.6}
    .nd{fill:#333;stroke:#111;stroke-width:1.5}
    .nt{fill:#fff;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .el{font-size:17px}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="630" height="290" fill="#fff"/>
  <line class="ln" x1="90.0" y1="60.0" x2="278.0" y2="60.0" marker-end="url(#ah)"/>
  <text class="el" x="185" y="48" text-anchor="middle"><tspan class="math">a</tspan> = 5</text>
  <line class="ln" x1="89.1" y1="65.9" x2="339.0" y2="143.5" marker-end="url(#ah)"/>
  <text class="el" x="230" y="92" text-anchor="middle"><tspan class="math">c</tspan> = 7</text>
  <line class="ln" x1="70.0" y1="80.0" x2="70.0" y2="218.0" marker-end="url(#ah)"/>
  <text class="el" x="40" y="156" text-anchor="middle"><tspan class="math">b</tspan> = 5</text>
  <line class="ln" x1="89.1" y1="234.1" x2="339.0" y2="156.5" marker-end="url(#ah)"/>
  <text class="el" x="200" y="178" text-anchor="middle"><tspan class="math">d</tspan> = 1</text>
  <line class="ln" x1="90.0" y1="240.0" x2="278.0" y2="240.0" marker-end="url(#ah)"/>
  <text class="el" x="185" y="268" text-anchor="middle"><tspan class="math">e</tspan> = 5</text>
  <line class="ln" x1="318.9" y1="66.5" x2="539.2" y2="142.8" marker-end="url(#ah)"/>
  <text class="el" x="450" y="88" text-anchor="middle"><tspan class="math">g</tspan> = 2</text>
  <line class="ln" x1="380.0" y1="150.0" x2="538.0" y2="150.0" marker-end="url(#ah)"/>
  <text class="el" x="460" y="140" text-anchor="middle"><tspan class="math">h</tspan> = 4</text>
  <line class="ln" x1="318.9" y1="233.5" x2="539.2" y2="157.2" marker-end="url(#ah)"/>
  <text class="el" x="450" y="230" text-anchor="middle"><tspan class="math">f</tspan> = 3</text>
  <circle class="nd" cx="70" cy="60" r="20"/>
  <text class="nt" x="70" y="60">A</text>
  <circle class="nd" cx="300" cy="60" r="20"/>
  <text class="nt" x="300" y="60">B</text>
  <circle class="nd" cx="70" cy="240" r="20"/>
  <text class="nt" x="70" y="240">C</text>
  <circle class="nd" cx="360" cy="150" r="20"/>
  <text class="nt" x="360" y="150">D</text>
  <circle class="nd" cx="300" cy="240" r="20"/>
  <text class="nt" x="300" y="240">E</text>
  <circle class="nd" cx="560" cy="150" r="20"/>
  <text class="nt" x="560" y="150">F</text>
</svg>
