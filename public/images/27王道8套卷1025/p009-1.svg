<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <style>
    text{font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#1a1a1a}
    .ln{stroke:#333;stroke-width:1.8;fill:none}
    .host{font-size:17px;text-anchor:middle;dominant-baseline:central}
    .dev{font-size:16px;font-weight:600}
  </style>
  <defs>
    <g id="pc">
      <rect x="-28" y="-30" width="56" height="42" rx="3" fill="#e8e8e8" stroke="#222" stroke-width="1.6"/>
      <rect x="-21" y="-24" width="42" height="29" fill="#fff" stroke="#555" stroke-width="1.2"/>
      <rect x="-6" y="12" width="12" height="6" fill="#bbb" stroke="#222" stroke-width="1.2"/>
      <rect x="-36" y="18" width="72" height="9" rx="2" fill="#555" stroke="#222" stroke-width="1.2"/>
    </g>
    <g id="box">
      <polygon points="-44,-4 -24,-22 44,-22 24,-4" fill="#f2f2f2" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="24,-4 44,-22 44,2 24,20" fill="#bdbdbd" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="-44" y="-4" width="68" height="24" fill="#dcdcdc" stroke="#222" stroke-width="1.6"/>
    </g>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fff"/>

  <!-- links -->
  <line class="ln" x1="70" y1="160" x2="200" y2="160"/>
  <line class="ln" x1="240" y1="160" x2="470" y2="160"/>
  <line class="ln" x1="230" y1="78" x2="230" y2="140"/>
  <line class="ln" x1="230" y1="178" x2="230" y2="238"/>
  <line class="ln" x1="490" y1="78" x2="490" y2="140"/>
  <line class="ln" x1="490" y1="178" x2="490" y2="238"/>
  <line class="ln" x1="520" y1="160" x2="640" y2="160"/>

  <!-- hub -->
  <g transform="translate(230,160)">
    <use href="#box"/>
    <line x1="-16" y1="-13" x2="18" y2="-13" stroke="#222" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text class="dev" x="268" y="204">集线器</text>

  <!-- switch -->
  <g transform="translate(490,160)">
    <use href="#box"/>
    <line x1="-14" y1="-17" x2="22" y2="-17" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="14" y1="-9" x2="-22" y2="-9" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  </g>
  <text class="dev" x="528" y="204">交换机</text>

  <!-- hosts -->
  <g transform="translate(60,166)"><use href="#pc"/><text class="host" x="0" y="-10">A</text></g>
  <g transform="translate(230,52)"><use href="#pc"/><text class="host" x="0" y="-10">B</text></g>
  <g transform="translate(230,272)"><use href="#pc"/><text class="host" x="0" y="-10">C</text></g>
  <g transform="translate(490,52)"><use href="#pc"/><text class="host" x="0" y="-10">D</text></g>
  <g transform="translate(490,272)"><use href="#pc"/><text class="host" x="0" y="-10">F</text></g>
  <g transform="translate(660,166)"><use href="#pc"/><text class="host" x="0" y="-10">E</text></g>
</svg>
