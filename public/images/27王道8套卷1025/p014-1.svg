<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
  <style>
    text{font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#1a1a1a}
    .ln{stroke:#333;stroke-width:1.8;fill:none}
    .t{font-size:14px;text-anchor:middle}
    .b{font-size:15px;text-anchor:middle;font-weight:600}
    .m{font-size:13px;text-anchor:middle;fill:#333}
    .wave{fill:none;stroke:#555;stroke-width:2;stroke-linecap:round}
  </style>
  <defs>
    <g id="laptop">
      <path d="M-34,-44 L30,-44 L30,0 L-34,0 Z" fill="#e8e8e8" stroke="#222" stroke-width="1.6" transform="skewX(-8)"/>
      <path d="M-28,-38 L24,-38 L24,-6 L-28,-6 Z" fill="#fff" stroke="#666" stroke-width="1.1" transform="skewX(-8)"/>
      <path d="M-40,0 L36,0 L44,10 L-36,10 Z" fill="#bdbdbd" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="820" height="330" fill="#fff"/>

  <!-- links -->
  <line class="ln" x1="136" y1="118" x2="252" y2="118"/>
  <line class="ln" x1="336" y1="118" x2="476" y2="118"/>
  <text class="m" x="194" y="106">100BaseT</text>
  <text class="m" x="408" y="106">100BaseT</text>

  <!-- server -->
  <g transform="translate(100,118)">
    <rect x="-30" y="-56" width="60" height="112" rx="4" fill="#e6e6e6" stroke="#222" stroke-width="1.8"/>
    <rect x="-22" y="-46" width="44" height="10" rx="1.5" fill="#fff" stroke="#444" stroke-width="1.1"/>
    <rect x="-22" y="-30" width="44" height="10" rx="1.5" fill="#fff" stroke="#444" stroke-width="1.1"/>
    <line x1="-22" y1="-8" x2="22" y2="-8" stroke="#888" stroke-width="1.2"/>
    <line x1="-22" y1="-2" x2="22" y2="-2" stroke="#888" stroke-width="1.2"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#888" stroke-width="1.2"/>
    <circle cx="0" cy="34" r="5" fill="#666"/>
  </g>
  <text class="b" x="100" y="198">Host-S</text>
  <text class="t" x="100" y="217">服务器</text>
  <text class="m" x="100" y="238">IP 10.0.0.8/24</text>
  <text class="m" x="100" y="256">MAC 00-11-11-11-11-88</text>

  <!-- switch -->
  <g transform="translate(294,122)">
    <polygon points="-44,-4 -24,-22 44,-22 24,-4" fill="#f2f2f2" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="24,-4 44,-22 44,2 24,20" fill="#bdbdbd" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="-44" y="-4" width="68" height="24" fill="#dcdcdc" stroke="#222" stroke-width="1.6"/>
    <path d="M-16,-16 H14 M8,-19 L14,-16 L8,-13" stroke="#222" stroke-width="1.4" fill="none"/>
    <path d="M18,-10 H-12 M-6,-13 L-12,-10 L-6,-7" stroke="#222" stroke-width="1.4" fill="none"/>
  </g>
  <text class="b" x="292" y="168">S</text>
  <text class="t" x="292" y="187">交换机</text>

  <!-- AP -->
  <g transform="translate(486,118)">
    <path d="M-10,40 L-5,-30 L5,-30 L10,40 Z" fill="#dcdcdc" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="-16" y="40" width="32" height="8" rx="2" fill="#888" stroke="#222" stroke-width="1.4"/>
    <circle cx="0" cy="-38" r="3.5" fill="#222"/>
    <path class="wave" d="M-9,-47 A13,13 0 0 0 -9,-29"/>
    <path class="wave" d="M9,-47 A13,13 0 0 1 9,-29"/>
    <path class="wave" d="M-15,-53 A21,21 0 0 0 -15,-23"/>
    <path class="wave" d="M15,-53 A21,21 0 0 1 15,-23"/>
  </g>
  <text class="b" x="486" y="190">AP</text>
  <text class="t" x="486" y="209">无线接入点</text>
  <text class="m" x="486" y="229">BSSID/MAC</text>
  <text class="m" x="486" y="247">00-11-11-11-11-C1</text>

  <!-- radio waves toward STA1 / STA2 -->
  <g transform="translate(528,96) rotate(-24)">
    <path class="wave" d="M10,-14 A18,18 0 0 1 10,14"/>
    <path class="wave" d="M22,-22 A30,30 0 0 1 22,22"/>
    <path class="wave" d="M34,-30 A42,42 0 0 1 34,30"/>
  </g>
  <g transform="translate(528,140) rotate(24)">
    <path class="wave" d="M10,-14 A18,18 0 0 1 10,14"/>
    <path class="wave" d="M22,-22 A30,30 0 0 1 22,22"/>
    <path class="wave" d="M34,-30 A42,42 0 0 1 34,30"/>
  </g>

  <!-- STA1 -->
  <g transform="translate(700,60)"><use href="#laptop"/></g>
  <text class="b" x="700" y="94">STA1</text>
  <text class="t" x="700" y="112">终端 STA1</text>
  <text class="m" x="700" y="130">MAC 00-11-11-11-11-D1</text>

  <!-- STA2 -->
  <g transform="translate(700,226)"><use href="#laptop"/></g>
  <text class="b" x="700" y="260">STA2</text>
  <text class="t" x="700" y="278">终端 STA2</text>
  <text class="m" x="700" y="296">MAC 00-11-11-11-11-E1</text>
</svg>
