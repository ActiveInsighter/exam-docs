<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250">
  <style>
    text{font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#1a1a1a}
    .node{fill:#efefef;stroke:#222;stroke-width:1.6}
    .ln{fill:none;stroke:#333;stroke-width:1.6}
    .name{font-size:20px;text-anchor:middle;dominant-baseline:central}
    .lbl{font-size:14px;fill:#333}
    .var{font-size:13px;fill:#777}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="640" height="250" fill="#fff"/>

  <!-- links -->
  <path class="ln" d="M90,128 L136,128" marker-end="url(#ah)"/>
  <path class="ln" d="M210,108 C235,70 250,58 282,58" marker-end="url(#ah)"/>
  <path class="ln" d="M362,52 C430,40 480,44 532,80" marker-end="url(#ah)"/>
  <path class="ln" d="M362,76 C395,90 412,104 418,140" marker-end="url(#ah)"/>
  <path class="ln" d="M210,150 C250,196 330,196 392,176" marker-end="url(#ah)"/>
  <path class="ln" d="M470,166 C510,160 530,140 548,120" marker-end="url(#ah)"/>

  <!-- nodes -->
  <rect class="node" x="30" y="104" width="60" height="48"/>
  <text class="name" x="60" y="128">C</text>
  <rect class="node" x="140" y="100" width="70" height="56"/>
  <text class="name" x="175" y="128">A</text>
  <rect class="node" x="286" y="34" width="76" height="50"/>
  <text class="name" x="324" y="59">B</text>
  <rect class="node" x="396" y="146" width="76" height="50"/>
  <text class="name" x="434" y="171">D</text>
  <rect class="node" x="536" y="56" width="76" height="60"/>
  <text class="name" x="574" y="86">S</text>

  <!-- delays -->
  <text class="lbl" x="206" y="62">5 ms</text>
  <text class="lbl" x="410" y="26">5 ms<tspan class="var">（可变）</tspan></text>
  <text class="lbl" x="420" y="108">12 ms</text>
  <text class="lbl" x="246" y="214">5 ms<tspan class="var">（可变）</tspan></text>
  <text class="lbl" x="512" y="182">5 ms</text>
</svg>
