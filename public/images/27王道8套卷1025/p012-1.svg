<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350">
  <style>
    text{font-family:"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#1a1a1a}
    .w{fill:none;stroke:#222;stroke-width:1.6}
    .blk{fill:#f0f0f0;stroke:#222;stroke-width:1.8}
    .mux{fill:#d6d6d6;stroke:#222;stroke-width:1.6}
    .port{font-size:14px}
    .sig{font-size:14px}
    .ctl{font-size:14px;font-weight:600;text-anchor:middle}
    .bits{font-size:13px;fill:#444}
    .mx{font-size:11px;text-anchor:middle;dominant-baseline:central}
    .name{font-size:16px;text-anchor:middle;font-weight:600}
    .dot{fill:#222}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="900" height="350" fill="#fff"/>

  <!-- instruction fields -->
  <path class="w" d="M20,100 V280"/>
  <path class="w" d="M20,100 H150" marker-end="url(#a)"/>
  <path class="w" d="M20,134 H150" marker-end="url(#a)"/>
  <path class="w" d="M60,134 V160 H90" marker-end="url(#a)"/>
  <path class="w" d="M20,190 H90" marker-end="url(#a)"/>
  <path class="w" d="M20,280 H184" marker-end="url(#a)"/>
  <circle class="dot" cx="20" cy="134" r="3"/>
  <circle class="dot" cx="20" cy="190" r="3"/>
  <circle class="dot" cx="60" cy="134" r="3"/>
  <text class="bits" x="28" y="94">25:21</text>
  <text class="bits" x="28" y="128">20:16</text>
  <text class="bits" x="28" y="184">15:11</text>
  <text class="bits" x="28" y="274">15:0</text>
  <text class="sig" x="122" y="94">rs</text>
  <text class="sig" x="122" y="128">rt</text>
  <text class="sig" x="64" y="206">rd</text>

  <!-- RegDst mux -->
  <path class="w" d="M100,30 V158" marker-end="url(#a)"/>
  <text class="ctl" x="100" y="22">RegDst</text>
  <polygon class="mux" points="90,148 110,158 110,192 90,202"/>
  <text class="mx" x="99" y="161">0</text>
  <text class="mx" x="99" y="189">1</text>
  <path class="w" d="M110,175 H150" marker-end="url(#a)"/>

  <!-- register file -->
  <rect class="blk" x="150" y="70" width="140" height="160"/>
  <path class="w" d="M220,30 V70" marker-end="url(#a)"/>
  <text class="ctl" x="220" y="22">RegWrite</text>
  <text class="port" x="220" y="90" text-anchor="middle">WE</text>
  <text class="port" x="158" y="105">R1#</text>
  <text class="port" x="158" y="139">R2#</text>
  <text class="port" x="158" y="180">W#</text>
  <text class="port" x="158" y="211">WD</text>
  <text class="port" x="282" y="105" text-anchor="end">R1</text>
  <text class="port" x="282" y="139" text-anchor="end">R2</text>
  <text class="name" x="228" y="160">寄存器堆</text>
  <polygon points="210,230 220,218 230,230" fill="#fff" stroke="#222" stroke-width="1.4"/>
  <text class="port" x="220" y="250" text-anchor="middle">CLK</text>

  <!-- sign extend -->
  <polygon class="blk" points="184,266 300,262 300,298 184,294"/>
  <text class="name" x="242" y="286" style="font-size:14px">符号扩展</text>
  <path class="w" d="M300,280 H380 V186 H400" marker-end="url(#a)"/>
  <text class="sig" x="306" y="300">SignImm</text>

  <!-- R1 / R2 -->
  <path class="w" d="M290,100 H470" marker-end="url(#a)"/>
  <text class="sig" x="430" y="92">SrcA</text>
  <path class="w" d="M290,134 H400" marker-end="url(#a)"/>
  <path class="w" d="M350,134 V211 H620" marker-end="url(#a)"/>
  <circle class="dot" cx="350" cy="134" r="3"/>
  <text class="sig" x="470" y="203">WriteData</text>

  <!-- AluSrc mux -->
  <path class="w" d="M410,30 V125" marker-end="url(#a)"/>
  <text class="ctl" x="410" y="22">AluSrc</text>
  <polygon class="mux" points="400,120 420,130 420,190 400,200"/>
  <text class="mx" x="409" y="135">0</text>
  <text class="mx" x="409" y="186">1</text>
  <path class="w" d="M420,160 H470" marker-end="url(#a)"/>
  <text class="sig" x="430" y="178">SrcB</text>

  <!-- ALU -->
  <polygon class="blk" points="470,78 522,104 522,156 470,182 470,142 484,130 470,118"/>
  <text class="name" x="503" y="136" style="font-size:15px">ALU</text>
  <path class="w" d="M522,130 H620" marker-end="url(#a)"/>
  <text class="sig" x="528" y="122">AluResult</text>
  <path class="w" d="M596,130 V46 H796 V104 H820" marker-end="url(#a)"/>
  <circle class="dot" cx="596" cy="130" r="3"/>

  <!-- data memory -->
  <rect class="blk" x="620" y="70" width="120" height="160"/>
  <path class="w" d="M680,30 V70" marker-end="url(#a)"/>
  <text class="ctl" x="680" y="22">MemWrite</text>
  <text class="port" x="680" y="90" text-anchor="middle">WE</text>
  <text class="port" x="628" y="135">A</text>
  <text class="port" x="732" y="151" text-anchor="end">RD</text>
  <text class="port" x="628" y="216">WD</text>
  <text class="name" x="680" y="176">数据</text>
  <text class="name" x="680" y="196">存储器</text>
  <polygon points="670,230 680,218 690,230" fill="#fff" stroke="#222" stroke-width="1.4"/>
  <text class="port" x="680" y="250" text-anchor="middle">CLK</text>
  <path class="w" d="M740,146 H820" marker-end="url(#a)"/>
  <text class="sig" x="748" y="139">ReadData</text>

  <!-- MemToReg mux -->
  <path class="w" d="M830,30 V93" marker-end="url(#a)"/>
  <text class="ctl" x="830" y="22">MemToReg</text>
  <polygon class="mux" points="820,88 840,98 840,152 820,162"/>
  <text class="mx" x="829" y="106">0</text>
  <text class="mx" x="829" y="145">1</text>

  <!-- write back -->
  <path class="w" d="M840,125 H870 V325 H128 V206 H150" marker-end="url(#a)"/>
  <text class="sig" x="860" y="316" text-anchor="end">WriteBackData</text>
</svg>
