<svg xmlns="http://www.w3.org/2000/svg" width="760" height="209" viewBox="0 0 828 228" style="max-width:100%;height:auto;">
  <rect width="100%" height="100%" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8.4" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#111"/>
    </marker>
    <pattern id="shade" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
