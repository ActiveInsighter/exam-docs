    .arrow { fill: none; stroke: #111; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
    .text { fill: #111; font-family: "Times New Roman", "Noto Serif", serif; font-size: 31px; dominant-baseline: middle; text-anchor: middle; }
    .italic { font-style: italic; }
    .label { fill: #111; font-family: "Courier New", "Times New Roman", serif; font-size: 30px; text-anchor: start; dominant-baseline: middle; }
    .head { fill: #111; font-family: "Times New Roman", "Noto Serif", serif; font-size: 28px; font-weight: 600; text-anchor: start; dominant-baseline: middle; letter-spacing: 0.5px; }
    .small-italic { fill: #111; font-family: "Times New Roman", "Noto Serif", serif; font-size: 31px; font-style: italic; text-anchor: middle; dominant-baseline: middle; }
  </style>

