<svg xmlns="http://www.w3.org/2000/svg" width="740" height="436" viewBox="0 0 740 436" role="img"><style>svg{--ink:#0f172a;--sub:#475569;--mute:#94a3b8;--line:#64748b;--faint:#cbd5e1;--surface:#ffffff;--panel:#f1f5f9;--panel-line:#e2e8f0;--blue:#2563eb;--blue-bg:#dbeafe;--blue-ink:#1d4ed8;--green:#059669;--green-bg:#d1fae5;--green-ink:#047857;--amber:#d97706;--amber-bg:#fef3c7;--amber-ink:#b45309;--red:#dc2626;--red-bg:#fee2e2;--red-ink:#b91c1c;--violet:#7c3aed;--violet-bg:#ede9fe;--violet-ink:#6d28d9;--teal:#0891b2;--teal-bg:#cffafe;--teal-ink:#0e7490;--gray:#64748b;--gray-bg:#e2e8f0;--gray-ink:#475569}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs><marker id="ah-violet" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6 0.8L9.4 5L0.6 9.2L2.6 5z" class="ah-violet"/></marker></defs><rect x="10" y="8" width="720" height="194" rx="10" class="panel" stroke-width="1"/><text x="24" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">目标：先让 |n₁ − n₂| 最小，再让 |S₁ − S₂| 最大 ⇒ 最小的 ⌊n/2⌋ 个数一组</text><rect x="80" y="155" width="40" height="15" rx="4" class="f-blue s-blue" stroke-width="1.6"/><text x="100" y="145" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-blue">1</text><rect x="142" y="145" width="40" height="25" rx="4" class="f-blue s-blue" stroke-width="1.6"/><text x="162" y="135" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-blue">3</text><rect x="204" y="140" width="40" height="30" rx="4" class="f-blue s-blue" stroke-width="1.6"/><text x="224" y="130" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-blue">4</text><rect x="266" y="135" width="40" height="35" rx="4" class="f-amber s-amber" stroke-width="1.6"/><text x="286" y="125" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-amber">5</text><rect x="328" y="115" width="40" height="55" rx="4" class="f-amber s-amber" stroke-width="1.6"/><text x="348" y="105" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-amber">9</text><rect x="390" y="100" width="40" height="70" rx="4" class="f-amber s-amber" stroke-width="1.6"/><text x="410" y="90" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-amber">12</text><rect x="452" y="60" width="40" height="110" rx="4" class="f-amber s-amber" stroke-width="1.6"/><text x="472" y="50" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-amber">20</text><path d="M255 50L255 182" class="s-red dash" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="255" y="192" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="mono b c-red">k = ⌊7/2⌋ = 3</text><text x="560" y="80" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b c-blue">A₁ = {1, 3, 4}，S₁ = 8</text><text x="560" y="106" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b c-amber">A₂ = {5, 9, 12, 20}，S₂ = 46</text><text x="560" y="136" text-anchor="start" dominant-baseline="central" style="font-size:13.5px" class="b c-green">|S₁ − S₂| = 38（最大）</text><text x="560" y="162" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="sub">组内不必有序</text><rect x="10" y="214" width="720" height="214" rx="10" class="panel" stroke-width="1"/><text x="24" y="232" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">快速选择（三路划分）：只递归包含位置 k 的那一段</text><rect x="120" y="284" width="50" height="36" rx="0" class="f-blue s-blue" stroke-width="1.6"/><text x="145" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-blue">3</text><rect x="170" y="284" width="50" height="36" rx="0" class="f-blue s-blue" stroke-width="1.6"/><text x="195" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-blue">1</text><rect x="220" y="284" width="50" height="36" rx="0" class="f-blue s-blue" stroke-width="1.6"/><text x="245" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-blue">4</text><rect x="270" y="284" width="50" height="36" rx="0" class="f-violet s-violet" stroke-width="1.6"/><text x="295" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-violet">5</text><rect x="320" y="284" width="50" height="36" rx="0" class="f-violet s-violet" stroke-width="1.6"/><text x="345" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-violet">5</text><rect x="370" y="284" width="50" height="36" rx="0" class="f-violet s-violet" stroke-width="1.6"/><text x="395" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-violet">5</text><rect x="420" y="284" width="50" height="36" rx="0" class="f-amber s-amber" stroke-width="1.6"/><text x="445" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-amber">12</text><rect x="470" y="284" width="50" height="36" rx="0" class="f-amber s-amber" stroke-width="1.6"/><text x="495" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-amber">9</text><rect x="520" y="284" width="50" height="36" rx="0" class="f-amber s-amber" stroke-width="1.6"/><text x="545" y="302.5" text-anchor="middle" dominant-baseline="central" class="mono b c-amber">20</text><text x="145" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">0</text><text x="195" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">1</text><text x="245" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">2</text><text x="295" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">3</text><text x="345" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">4</text><text x="395" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">5</text><text x="445" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">6</text><text x="495" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">7</text><text x="545" y="332" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono mute">8</text><path d="M122 339L122 346L268 346L268 339" class="s-blue" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="195" y="359" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="c-blue">&lt; pivot</text><path d="M272 339L272 346L418 346L418 339" class="s-violet" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="345" y="359" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="c-violet">= pivot</text><path d="M422 339L422 346L568 346L568 339" class="s-amber" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="495" y="359" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="c-amber">&gt; pivot</text><path d="M295 266L295 279" class="s-violet" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-violet)"/><text x="295" y="256" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="mono b c-violet">lt</text><path d="M395 266L395 279" class="s-violet" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-violet)"/><text x="395" y="256" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="mono b c-violet">gt</text><text x="370" y="382" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="b">k &lt; lt：只处理左段；k &gt; gt+1：只处理右段；否则前 k 个已是最小的 k 个</text><text x="370" y="404" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">期望 O(n)，最坏 O(n²)；不必整体排序（排序需 O(n log n)）</text></svg>
