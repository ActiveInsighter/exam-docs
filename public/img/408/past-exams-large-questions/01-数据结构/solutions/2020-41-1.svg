<svg xmlns="http://www.w3.org/2000/svg" width="740" height="556" viewBox="0 0 740 556" role="img"><style>svg{--ink:#0f172a;--sub:#475569;--mute:#94a3b8;--line:#64748b;--faint:#cbd5e1;--surface:#ffffff;--panel:#f1f5f9;--panel-line:#e2e8f0;--blue:#2563eb;--blue-bg:#dbeafe;--blue-ink:#1d4ed8;--green:#059669;--green-bg:#d1fae5;--green-ink:#047857;--amber:#d97706;--amber-bg:#fef3c7;--amber-ink:#b45309;--red:#dc2626;--red-bg:#fee2e2;--red-ink:#b91c1c;--violet:#7c3aed;--violet-bg:#ede9fe;--violet-ink:#6d28d9;--teal:#0891b2;--teal-bg:#cffafe;--teal-ink:#0e7490;--gray:#64748b;--gray-bg:#e2e8f0;--gray-ink:#475569}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6 0.8L9.4 5L0.6 9.2L2.6 5z" class="ah-line"/></marker></defs><rect x="10" y="8" width="720" height="132" rx="10" class="panel" stroke-width="1"/><text x="24" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">把距离化成极差：D = |a−b| + |b−c| + |c−a| = 2·(max − min)</text><path d="M60 92L520 92" class="ln" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M164 84Q234 58 304 84" class="s-violet" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 84Q374 58 444 84" class="s-violet" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M164 100Q304 126 444 100" class="s-violet" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="234" y="58" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="c-violet">y − x</text><text x="374" y="58" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="c-violet">z − y</text><text x="304" y="128" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="c-violet">z − x</text><circle cx="164" cy="92" r="6" class="f-blue s-blue" stroke-width="2"/><text x="164" y="70" text-anchor="middle" dominant-baseline="central"></text><text x="158" y="112" text-anchor="end" dominant-baseline="central" style="font-size:12px" class="b c-blue">x = min</text><circle cx="304" cy="92" r="6" class="f-amber s-amber" stroke-width="2"/><text x="304" y="70" text-anchor="middle" dominant-baseline="central"></text><text x="304" y="112" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-amber">y</text><circle cx="444" cy="92" r="6" class="f-green s-green" stroke-width="2"/><text x="444" y="70" text-anchor="middle" dominant-baseline="central"></text><text x="450" y="112" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b c-green">z = max</text><text x="560" y="74" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono">(y−x)+(z−y)+(z−x)</text><text x="560" y="98" text-anchor="start" dominant-baseline="central" style="font-size:15px" class="mono b c-violet">= 2(z − x)</text><text x="560" y="120" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="sub">中间值不影响 D</text><rect x="10" y="152" width="720" height="396" rx="10" class="panel" stroke-width="1"/><text x="24" y="170" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">每轮记录 D，然后只推进当前最小值所在数组的指针</text><path d="M96 214L460.8 214" class="ln faint" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="105.6" y="209" width="259.20000000000005" height="10" rx="5" class="f-violet s-violet" stroke-width="1"/><circle cx="336" cy="214" r="6.5" class="f-blue s-blue" stroke-width="2"/><text x="336" y="199" text-anchor="middle" dominant-baseline="central" style="font-size:11px" class="mono b c-blue">-1</text><circle cx="105.6" cy="214" r="6.5" class="f-amber s-amber" stroke-width="2"/><text x="105.6" y="229" text-anchor="middle" dominant-baseline="central" style="font-size:11px" class="mono b c-amber">-25</text><circle cx="364.8" cy="214" r="6.5" class="f-teal s-teal" stroke-width="2"/><text x="364.8" y="199" text-anchor="middle" dominant-baseline="central" style="font-size:11px" class="mono b c-teal">2</text><text x="500" y="214" text-anchor="start" dominant-baseline="central" style="font-size:1