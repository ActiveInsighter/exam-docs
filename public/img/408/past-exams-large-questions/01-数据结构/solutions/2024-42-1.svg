entral" style="font-size:13px" class="b c-amber">查找 14：探测 9 → 10 → 2，依次与 3、18、14 比较（3 次）</text><text x="370" y="376" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">装填因子 α = 7/11；k² mod 11 只能取 {0,1,3,4,5,9}，单向平方探测不一定覆盖全表</text></svg>
