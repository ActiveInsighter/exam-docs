<svg xmlns="http://www.w3.org/2000/svg" width="740" height="470" viewBox="0 0 740 470" role="img"><style>svg{--ink:#0f172a;--sub:#475569;--mute:#94a3b8;--line:#64748b;--faint:#cbd5e1;--surface:#ffffff;--panel:#f1f5f9;--panel-line:#e2e8f0;--blue:#2563eb;--blue-bg:#dbeafe;--blue-ink:#1d4ed8;--green:#059669;--green-bg:#d1fae5;--green-ink:#047857;--amber:#d97706;--amber-bg:#fef3c7;--amber-ink:#b45309;--red:#dc2626;--red-bg:#fee2e2;--red-ink:#b91c1c;--violet:#7c3aed;--violet-bg:#ede9fe;--violet-ink:#6d28d9;--teal:#0891b2;--teal-bg:#cffafe;--teal-ink:#0e7490;--gray:#64748b;--gray-bg:#e2e8f0;--gray-ink:#475569}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6 0.8L9.4 5L0.6 9.2L2.6 5z" class="ah-line"/></marker></defs><text x="20" y="22" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b c-green">例 1：每轮候选集合都只有 1 个顶点 ⇒ 拓扑序唯一（1, 2, 3, 4）</text><rect x="10" y="34" width="172" height="196" rx="10" class="panel" stroke-width="1"/><text x="24" y="52" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b sub">第 1 轮</text><path d="M39 130.6L81.2 106.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M39 145.4L81.2 169.6" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M96 113L96 161" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M109 105.4L151.2 129.6" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M109 170.6L151.2 146.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><circle cx="26" cy="138" r="15" class="f-green s-green" stroke-width="1.8"/><text x="26" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">1</text><circle cx="96" cy="98" r="15" class="box" stroke-width="1.4"/><text x="96" y="98.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">2</text><circle cx="96" cy="178" r="15" class="box" stroke-width="1.4"/><text x="96" y="178.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">3</text><circle cx="166" cy="138" r="15" class="box" stroke-width="1.4"/><text x="166" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">4</text><text x="96" y="212" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-green">Z = {1}</text><rect x="192" y="34" width="172" height="196" rx="10" class="panel" stroke-width="1"/><text x="206" y="52" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b sub">第 2 轮</text><path d="M221 130.6L263.2 106.4" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M221 145.4L263.2 169.6" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M278 113L278 161" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M291 105.4L333.2 129.6" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M291 170.6L333.2 146.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><circle cx="208" cy="138" r="15" class="box ghost" stroke-width="1.4"/><text x="208" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">1</text><circle cx="278" cy="98" r="15" class="f-green s-green" stroke-width="1.8"/><text x="278" y="98.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">2</text><circle cx="278" cy="178" r="15" class="box" stroke-width="1.4"/><text x="278" y="178.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">3</text><circle cx="348" cy="138" r="15" class="box" stroke-width="1.4"/><text x="348" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">4</text><text x="278" y="212" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-green">Z = {2}</text><rect x="374" y="34" width="172" height="196" rx="10" class="panel" stroke-width="1"/><text x="388" y="52" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b sub">第 3 轮</text><path d="M403 130.6L445.2 106.4" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M403 145.4L445.2 169.6" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M460 113L460 161" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M473 105.4L515.2 129.6" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M473 170.6L515.2 146.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><circle cx="390" cy="138" r="15" class="box ghost" stroke-width="1.4"/><text x="390" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">1</text><circle cx="460" cy="98" r="15" class="box ghost" stroke-width="1.4"/><text x="460" y="98.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">2</text><circle cx="460" cy="178" r="15" class="f-green s-green" stroke-width="1.8"/><text x="460" y="178.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">3</text><circle cx="530" cy="138" r="15" class="box" stroke-width="1.4"/><text x="530" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">4</text><text x="460" y="212" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-green">Z = {3}</text><rect x="556" y="34" width="172" height="196" rx="10" class="panel" stroke-width="1"/><text x="570" y="52" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b sub">第 4 轮</text><path d="M585 130.6L627.2 106.4" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M585 145.4L627.2 169.6" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M642 113L642 161" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M655 105.4L697.2 129.6" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M655 170.6L697.2 146.4" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><circle cx="572" cy="138" r="15" class="box ghost" stroke-width="1.4"/><text x="572" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">1</text><circle cx="642" cy="98" r="15" class="box ghost" stroke-width="1.4"/><text x="642" y="98.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">2</text><circle cx="642" cy="178" r="15" class="box ghost" stroke-width="1.4"/><text x="642" y="178.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">3</text><circle cx="712" cy="138" r="15" class="f-green s-green" stroke-width="1.8"/><text x="712" y="138.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">4</text><text x="642" y="212" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-green">Z = {4}</text><text x="20" y="252" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b c-red">例 2：第 2 轮候选集合 {2, 3} ⇒ 2、3 谁先都行，不唯一，返回 0</text><rect x="10" y="264" width="172" height="196" rx="10" class="panel" stroke-width="1"/><text x="24" y="282" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b sub">第 1 轮</text><path d="M39 360.6L81.2 336.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M39 375.4L81.2 399.6" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M109 335.4L151.2 359.6" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M109 400.6L151.2 376.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><circle cx="26" cy="368" r="15" class="f-green s-green" stroke-width="1.8"/><text x="26" y="368.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">1</text><circle cx="96" cy="328" r="15" class="box" stroke-width="1.4"/><text x="96" y="328.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">2</text><circle cx="96" cy="408" r="15" class="box" stroke-width="1.4"/><text x="96" y="408.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">3</text><circle cx="166" cy="368" r="15" class="box" stroke-width="1.4"/><text x="166" y="368.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">4</text><text x="96" y="442" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-green">Z = {1}</text><rect x="192" y="264" width="172" height="196" rx="10" class="panel" stroke-width="1"/><text x="206" y="282" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b sub">第 2 轮</text><path d="M221 360.6L263.2 336.4" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M221 375.4L263.2 399.6" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M291 335.4L333.2 359.6" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M291 400.6L333.2 376.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><circle cx="208" cy="368" r="15" class="box ghost" stroke-width="1.4"/><text x="208" y="368.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">1</text><circle cx="278" cy="328" r="15" class="f-red s-red" stroke-width="1.8"/><text x="278" y="328.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-red">2</text><circle cx="278" cy="408" r="15" class="f-red s-red" stroke-width="1.8"/><text x="278" y="408.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-red">3</text><circle cx="348" cy="368" r="15" class="box" stroke-width="1.4"/><text x="348" y="368.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">4</text><text x="278" y="442" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-red">Z = {2,3}，|Z| ≠ 1</text><rect x="374" y="264" width="356" height="196" rx="10" class="panel" stroke-width="1"/><text x="392" y="292" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="b">Kahn 算法 + 统计候选数：</text><text x="392" y="318" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="c-green">|Z| = 1：唯一选择，删除它并更新入度</text><text x="392" y="342" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="c-red">|Z| ≥ 2：出现分叉 ⇒ 不唯一</text><text x="392" y="366" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="c-amber">|Z| = 0 且未删完：有环 ⇒ 无拓扑序</text><text x="392" y="398" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="sub">后两种都返回 0</text></svg>
