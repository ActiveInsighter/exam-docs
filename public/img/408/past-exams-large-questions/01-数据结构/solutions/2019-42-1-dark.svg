<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img"><style>svg{--ink:#e6e7ea;--sub:#a9adb6;--mute:#6b7079;--line:#8a909b;--faint:#454a53;--surface:#26292f;--panel:#1d2025;--panel-line:#30343b;--blue:#60a5fa;--blue-bg:#1e3a6e;--blue-ink:#93c5fd;--green:#34d399;--green-bg:#0f4a3a;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-bg:#523a0c;--amber-ink:#fcd34d;--red:#f87171;--red-bg:#5c1d1d;--red-ink:#fca5a5;--violet:#a78bfa;--violet-bg:#3b2a6b;--violet-ink:#c4b5fd;--teal:#22d3ee;--teal-bg:#0e4452;--teal-ink:#67e8f9;--gray:#9ca3af;--gray-bg:#3a3e46;--gray-ink:#d1d5db}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6 0.8L9.4 5L0.6 9.2L2.6 5z" class="ah-line"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6 0.8L9.4 5L0.6 9.2L2.6 5z" class="ah-blue"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6 0.8L9.4 5L0.6 9.2L2.6 5z" class="ah-amber"/></marker></defs><rect x="10" y="8" width="230" height="284" rx="10" class="panel" stroke-width="1"/><text x="24" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">① 初始：一个结点自成环</text><circle cx="125" cy="150" r="24" class="f-gray s-gray" stroke-width="1.8"/><text x="125" y="150.5" text-anchor="middle" dominant-baseline="central" class="b c-gray">N₀</text><path d="M 145 136 C 200 100, 200 200, 145 164" class="ln" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M112 100L112 121" class="s-blue" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="112" y="90" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-blue">front</text><path d="M112 200L112 179" class="s-amber" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/><text x="112" y="211" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-amber">rear</text><text x="125" y="250" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="b c-violet">front == rear ⇒ 队空</text><text x="125" y="272" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="sub">rear-&gt;next == front ⇒ 需扩容</text><rect x="250" y="8" width="480" height="284" rx="10" class="panel" stroke-width="1"/><text x="264" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">② 第一个元素 x 入队：先在 rear 后插入 N₁，再写入旧 rear</text><rect x="314" y="118" width="92" height="44" rx="8" class="f-blue s-blue" stroke-width="1.6"/><text x="346" y="140" text-anchor="middle" dominant-baseline="central" style="font-size:16px" class="b c-blue it">x</text><path d="M374 118L374 162" class="s-blue" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="554" y="118" width="92" height="44" rx="8" class="f-green s-green dash" stroke-width="1.6"/><text x="586" y="140" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="c-green">空</text><path d="M614 118L614 162" class="s-green dash" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M390 140L552 140" class="ln" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M630 140 L670 140 L670 210 L290 210 L290 140 L312 140" class="ln" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><text x="360" y="178" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b sub">N₀</text><text x="600" y="178" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-green">N₁（新申请）</text><path d="M360 90L360 113" class="s-blue" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="360" y="80" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-blue">front</text><path d="M600 90L600 113" class="s-amber" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-amber)"/><text x="600" y="80" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-amber">rear</text><text x="490" y="252" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">有效元素：front 起到 rear 之前；rear 永远指向一个空闲结点</text></svg>
