<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img"><style>svg{--ink:#e6e7ea;--sub:#a9adb6;--mute:#6b7079;--line:#8a909b;--faint:#454a53;--surface:#26292f;--panel:#1d2025;--panel-line:#30343b;--blue:#60a5fa;--blue-bg:#1e3a6e;--blue-ink:#93c5fd;--green:#34d399;--green-bg:#0f4a3a;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-bg:#523a0c;--amber-ink:#fcd34d;--red:#f87171;--red-bg:#5c1d1d;--red-ink:#fca5a5;--violet:#a78bfa;--violet-bg:#3b2a6b;--violet-ink:#c4b5fd;--teal:#22d3ee;--teal-bg:#0e4452;--teal-ink:#67e8f9;--gray:#9ca3af;--gray-bg:#3a3e46;--gray-ink:#d1d5db}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var