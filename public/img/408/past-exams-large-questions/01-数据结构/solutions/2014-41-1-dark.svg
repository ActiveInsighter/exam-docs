<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img"><style>svg{--ink:#e6e7ea;--sub:#a9adb6;--mute:#6b7079;--line:#8a909b;--faint:#454a53;--surface:#26292f;--panel:#1d2025;--panel-line:#30343b;--blue:#60a5fa;--blue-bg:#1e3a6e;--blue-ink:#93c5fd;--green:#34d399;--green-bg:#0f4a3a;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-bg:#523a0c;--amber-ink:#fcd34d;--red:#f87171;--red-bg:#5c1d1d;--red-ink:#fca5a5;--violet:#a78bfa;--violet-bg:#3b2a6b;--violet-ink:#c4b5fd;--teal:#22d3ee;--teal-bg:#0e4452;--teal-ink:#67e8f9;--gray:#9ca3af;--gray-bg:#3a3e46;--gray-ink:#d1d5db}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs></defs><rect x="20" y="30" width="440" height="66" rx="8" class="panel" stroke-width="0.8"/><text x="46" y="56" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="mono b sub">d = 0</text><rect x="20" y="104" width="440" height="66" rx="8" class="panel" stroke-width="0.8"/><text x="46" y="130" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="mono b sub">d = 1</text><rect x="20" y="178" width="440" height="66" rx="8" class="panel" stroke-width="0.8"/><text x="46" y="204" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="mono b sub">d = 2</text><rect x="20" y="252" width="440" height="66" rx="8" class="panel" stroke-width="0.8"/><text x="46" y="278" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="mono b sub">d = 3</text><path d="M341.1 219.7L316.9 262.3" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M358.9 219.7L383.1 262.3" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M275.3 143.7L235.7 190.3" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M298.7 143.7L338.3 190.3" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M200.8 68.8L152.7 117.2" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M226.2 68.8L274.3 117.2" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="140" cy="130" r="18" class="f-green s-green" stroke-width="1.8"/><text x="140" y="130.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">A</text><text x="140" y="160" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b c-green">w=2  2×1</text><circle cx="224" cy="204" r="18" class="f-green s-green" stroke-width="1.8"/><text x="224" y="204.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">C</text><text x="224" y="234" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b c-green">w=3  3×2</text><circle cx="308" cy="278" r="18" class="f-green s-green" stroke-width="1.8"/><text x="308" y="278.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">D</text><text x="308" y="308" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b c-green">w=5  5×3</text><circle cx="392" cy="278" r="18" class="f-green s-green" stroke-width="1.8"/><text x="392" y="278.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">F</text><text x="392" y="308" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b c-green">w=1  1×3</text><circle cx="350" cy="204" r="18" class="box" stroke-width="1.4"/><text x="350" y="204.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">E</text><circle cx="287" cy="130" r="18" class="box" stroke-width="1.4"/><text x="287" y="130.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">B</text><circle cx="213.5" cy="56" r="18" class="box" stroke-width="1.4"/><text x="213.5" y="56.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b">R</text><rect x="476" y="34" width="234" height="278" rx="10" class="panel" stroke-width="1"/><text x="490" y="52" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">递归 F(p, d)</text><text x="492" y="72" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono c-gray">p 为空 → 0</text><text x="492" y="98" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono c-green">p 为叶 → w(p)·d</text><text x="492" y="124" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono c-blue">否则 → F(左, d+1)</text><text x="492" y="150" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono c-blue">        + F(右, d+1)</text><text x="492" y="196" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="mono b c-violet">WPL = F(root, 0)</text><text x="492" y="230" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="mono">= 2 + 6 + 15 + 3</text><text x="492" y="256" text-anchor="start" dominant-baseline="central" style="font-size:15px" class="mono b c-green">= 26</text><text x="492" y="290" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="sub">只有绿色叶子参与求和</text></svg>
