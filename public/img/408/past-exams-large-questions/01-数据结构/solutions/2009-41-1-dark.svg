<svg xmlns="http://www.w3.org/2000/svg" width="740" height="316" viewBox="0 0 740 316" role="img"><style>svg{--ink:#e6e7ea;--sub:#a9adb6;--mute:#6b7079;--line:#8a909b;--faint:#454a53;--surface:#26292f;--panel:#1d2025;--panel-line:#30343b;--blue:#60a5fa;--blue-bg:#1e3a6e;--blue-ink:#93c5fd;--green:#34d399;--green-bg:#0f4a3a;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-bg:#523a0c;--amber-ink:#fcd34d;--red:#f87171;--red-bg:#5c1d1d;--red-ink:#fca5a5;--violet:#a78bfa;--violet-bg:#3b2a6b;--violet-ink:#c4b5fd;--teal:#22d3ee;--teal-bg:#0e4452;--teal-ink:#67e8f9;--gray:#9ca3af;--gray-bg:#3a3e46;--gray-ink:#d1d5db}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs><marker id="ah-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.6 0.8L9.4 5L0.6 9.2L2.6 5z" class="ah-red"/></marker></defs><rect x="10" y="8" width="410" height="300" rx="10" class="panel" stroke-width="1"/><text x="24" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">反例 ①：贪心路径比最短路长</text><path d="M81.8 183.8L137.1 107.8" class="s-red" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><rect x="100.4" y="136.8" width="18" height="18" rx="9" class="surface" stroke="var(--red)" stroke-width="1"/><text x="109.4" y="146.3" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-red">1</text><path d="M170 90L268 90" class="s-red" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><rect x="210" y="81" width="18" height="18" rx="9" class="surface" stroke="var(--red)" stroke-width="1"/><text x="219" y="90.5" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-red">1</text><path d="M301.8 106.2L357.1 182.2" class="s-red" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><rect x="320.4" y="135.2" width="18" height="18" rx="9" class="surface" stroke="var(--red)" stroke-width="1"/><text x="329.4" y="144.7" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-red">1</text><path d="M90 200L350 200" class="s-green dash" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="211" y="191" width="18" height="18" rx="9" class="surface" stroke="var(--green)" stroke-width="1"/><text x="220" y="200.5" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-green">2</text><circle cx="70" cy="200" r="20" class="f-blue s-blue" stroke-width="1.8"/><text x="70" y="200.5" text-anchor="middle" dominant-baseline="central" class="b c-blue">1</text><text x="70" y="234" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b sub">起点</text><circle cx="150" cy="90" r="20" class="box" stroke-width="1.4"/><text x="150" y="90.5" text-anchor="middle" dominant-baseline="central" class="b">2</text><circle cx="290" cy="90" r="20" class="box" stroke-width="1.4"/><text x="290" y="90.5" text-anchor="middle" dominant-baseline="central" class="b">3</text><circle cx="370" cy="200" r="20" class="f-blue s-blue" stroke-width="1.8"/><text x="370" y="200.5" text-anchor="middle" dominant-baseline="central" class="b c-blue">4</text><text x="370" y="234" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b sub">终点</text><text x="215" y="266" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="b c-red">贪心：1→2→3→4，长度 3</text><text x="215" y="290" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="b c-green">最短：1→4，长度 2</text><rect x="134.2" y="141.5" width="171.5" height="21" rx="10.5" class="f-red s-red" stroke-width="1.2"/><text x="220" y="152.5" text-anchor="middle" dominant-baseline="central" style="font-size:11px" class="b c-red">在点 1：边 1 &lt; 边 2，先去点 2</text><rect x="430" y="8" width="300" height="300" rx="10" class="panel" stroke-width="1"/><text x="444" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">反例 ②：贪心甚至走不到终点</text><path d="M537.6 140.5L630.6 90.4" class="s-red" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-red)"/><rect x="575.1" y="106.5" width="18" height="18" rx="9" class="surface" stroke="var(--red)" stroke-width="1"/><text x="584.1" y="116" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-red">1</text><path d="M538.2 158.4L631.8 201.6" class="ln dash" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="576" y="171" width="18" height="18" rx="9" class="surface" stroke="var(--faint)" stroke-width="0.8"/><text x="585" y="180.5" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b">2</text><circle cx="520" cy="150" r="20" class="f-blue s-blue" stroke-width="1.8"/><text x="520" y="150.5" text-anchor="middle" dominant-baseline="central" class="b c-blue">1</text><text x="520" y="184" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b sub">起点</text><circle cx="650" cy="80" r="20" class="box" stroke-width="1.4"/><text x="650" y="80.5" text-anchor="middle" dominant-baseline="central" class="b">2</text><circle cx="650" cy="210" r="20" class="f-blue s-blue" stroke-width="1.8"/><text x="650" y="210.5" text-anchor="middle" dominant-baseline="central" class="b c-blue">3</text><text x="650" y="242" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="mono b sub">终点</text><text x="690" y="56" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-red">死胡同</text><text x="580" y="268" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">到 2 后唯一邻点 1 已在路径中</text><text x="580" y="290" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="b c-red">无法继续 ⇒ 找不到路径</text></svg>
