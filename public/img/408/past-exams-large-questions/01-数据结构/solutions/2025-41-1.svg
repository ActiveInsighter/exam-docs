inecap="round" stroke-linejoin="round" /><text x="520" y="276" text-anchor="middle" dominant-baseline="central" style="font-size:11px" class="mono c-red">lo=−9</text><text x="706" y="276" text-anchor="middle" dominant-baseline="central" style="font-size:11px" class="mono c-green">hi=6</text><path d="M520 242.4L706 188.4" class="s-blue" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M520 137.1L706 258.6" class="s-amber" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="706" cy="188.4" r="5" class="f-blue s-blue" stroke-width="2"/><circle cx="520" cy="137.1" r="5" class="f-amber s-amber" stroke-width="2"/><text x="700" y="174.4" text-anchor="end" dominant-baseline="central" style="font-size:11px" class="b c-blue">x=4：max 在 hi</text><text x="528" y="127.1" text-anchor="start" dominant-baseline="central" style="font-size:11px" class="b c-amber">x=−9：max 在 lo</text><text x="612" y="300" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">x·y 是 y 的一次函数，</text><text x="612" y="320" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">区间上的最大值必在端点</text><text x="612" y="352" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-violet">res[i] = max(x·hi, x·lo)</text></svg>
