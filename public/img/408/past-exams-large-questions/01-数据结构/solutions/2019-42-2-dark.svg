oin="round" marker-end="url(#ah-line)"/><path d="M629.4 147.3A82 82 0 0 1 629.9 186.6" class="ln" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M607.6 226.4A82 82 0 0 1 573.8 246.5" class="ln" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M528.2 247.1A82 82 0 0 1 493.9 227.8" class="ln" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-line)"/><path d="M470.6 188.7A82 82 0 0 1 470.1 149.4" class="s-green dash" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><path d="M492.4 109.6A82 82 0 0 1 526.2 89.5" class="s-green dash" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-green)"/><circle cx="550" cy="86" r="21" class="f-blue s-blue" stroke-width="1.8"/><text x="550" y="86.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-blue">12</text><circle cx="621" cy="127" r="21" class="f-blue s-blue" stroke-width="1.8"/><text x="621" y="127.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-blue">7</text><circle cx="621" cy="209" r="21" class="f-blue s-blue" stroke-width="1.8"/><text x="621" y="209.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-blue">9</text><circle cx="550" cy="250" r="21" class="f-blue s-blue" stroke-width="1.8"/><text x="550" y="250.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-blue">4</text><circle cx="479" cy="209" r="21" class="f-gray s-gray" stroke-width="1.8"/><text x="479" y="209.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-gray">空</text><circle cx="479" cy="127" r="21" class="f-green s-green dash" stroke-width="1.8"/><text x="479" y="127.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-green">新</text><text x="550" y="53" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-blue">front</text><text x="471" y="243" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-amber">rear</text><text x="550" y="300" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="sub">只剩 rear 一个空结点时先扩容，再写入</text><text x="550" y="322" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="sub">空间只增不减；入队、出队都只改常数个指针</text></svg>
