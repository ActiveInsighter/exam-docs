<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" role="img"><style>svg{--ink:#e6e7ea;--sub:#a9adb6;--mute:#6b7079;--line:#8a909b;--faint:#454a53;--surface:#26292f;--panel:#1d2025;--panel-line:#30343b;--blue:#60a5fa;--blue-bg:#1e3a6e;--blue-ink:#93c5fd;--green:#34d399;--green-bg:#0f4a3a;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-bg:#523a0c;--amber-ink:#fcd34d;--red:#f87171;--red-bg:#5c1d1d;--red-ink:#fca5a5;--violet:#a78bfa;--violet-bg:#3b2a6b;--violet-ink:#c4b5fd;--teal:#22d3ee;--teal-bg:#0e4452;--teal-ink:#67e8f9;--gray:#9ca3af;--gray-bg:#3a3e46;--gray-ink:#d1d5db}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs></defs><rect x="10" y="8" width="440" height="314" rx="10" class="panel" stroke-width="1"/><text x="24" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">K = 12：沿查找路径走，每步舍弃一棵子树</text><path d="M81.3 146.7L66.7 183.3" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M94.7 146.7L109.3 183.3" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M176.4 216.5L192.8 253.5" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M203.1 145.3L178.7 184.7" class="s-blue" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M222.1 145.3L246.5 184.7" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M138.3 73.4L100 116.6" class="ln ghost" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M162.3 73.4L200.6 116.6" class="s-blue" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="60" cy="200" r="18" class="box ghost" stroke-width="1.4"/><text x="60" y="200.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">2</text><circle cx="116" cy="200" r="18" class="box ghost" stroke-width="1.4"/><text x="116" y="200.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">7</text><circle cx="88" cy="130" r="18" class="box ghost" stroke-width="1.4"/><text x="88" y="130.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">4</text><circle cx="200" cy="270" r="18" class="box ghost" stroke-width="1.4"/><text x="200" y="270.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">16</text><circle cx="169.2" cy="200" r="18" class="f-blue s-blue" stroke-width="1.8"/><text x="169.2" y="200.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-blue">14</text><text x="125.2" y="232" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-blue">|14−12| = 2</text><circle cx="256" cy="200" r="18" class="box ghost" stroke-width="1.4"/><text x="256" y="200.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b ghost">25</text><circle cx="212.6" cy="130" r="18" class="f-gray s-gray" stroke-width="1.8"/><text x="212.6" y="130.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-gray">18</text><text x="252.6" y="106" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="sub">|18−12| = 6</text><circle cx="150.3" cy="60" r="18" class="f-blue s-blue" stroke-width="1.8"/><text x="150.3" y="60.5" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="b c-blue">10</text><text x="88.3" y="60" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-blue">|10−12| = 2</text><text x="230" y="300" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">灰色子树离 K 更远，整棵舍弃；14 的左孩子为空，结束</text><rect x="460" y="8" width="270" height="314" rx="10" class="panel" stroke-width="1"/><text x="474" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">结论</text><text x="476" y="58" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono b">10 &lt; 12 → 右走</text><text x="476" y="78" text-anchor="start" dominant-baseline="central" style="font-size:11.5px" class="sub">左子树都 &lt; 10，更远</text><text x="476" y="104" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono b">18 &gt; 12 → 左走</text><text x="476" y="124" text-anchor="start" dominant-baseline="central" style="font-size:11.5px" class="sub">右子树都 &gt; 18，更远</text><text x="476" y="150" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="mono b">14 &gt; 12 → 左走</text><text x="476" y="170" text-anchor="start" dominant-baseline="central" style="font-size:11.5px" class="sub">左孩子为空，停</text><text x="476" y="210" text-anchor="start" dominant-baseline="central" style="font-size:15px" class="b c-green">最小差 = 2</text><text x="476" y="236" text-anchor="start" dominant-baseline="central" style="font-size:12.5px" class="b c-green">结点：10（前驱）和 14（后继）</text><text x="476" y="272" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="sub">只走一条路径：O(h) 时间</text><text x="476" y="294" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="sub">并列时两个都要输出</text></svg>
