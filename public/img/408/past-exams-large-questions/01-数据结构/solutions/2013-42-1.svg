<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" role="img"><style>svg{--ink:#0f172a;--sub:#475569;--mute:#94a3b8;--line:#64748b;--faint:#cbd5e1;--surface:#ffffff;--panel:#f1f5f9;--panel-line:#e2e8f0;--blue:#2563eb;--blue-bg:#dbeafe;--blue-ink:#1d4ed8;--green:#059669;--green-bg:#d1fae5;--green-ink:#047857;--amber:#d97706;--amber-bg:#fef3c7;--amber-ink:#b45309;--red:#dc2626;--red-bg:#fee2e2;--red-ink:#b91c1c;--violet:#7c3aed;--violet-bg:#ede9fe;--violet-ink:#6d28d9;--teal:#0891b2;--teal-bg:#cffafe;--teal-ink:#0e7490;--gray:#64748b;--gray-bg:#e2e8f0;--gray-ink:#475569}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs></defs><rect x="10" y="8" width="330" height="314" rx="10" class="panel" stroke-width="1"/><text x="24" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">顺序表：按概率降序排，顺序查找</text><text x="40" y="71" text-anchor="middle" dominant-baseline="central" class="mono b c-violet">1</text><rect x="60" y="56" width="90" height="32" rx="5" class="f-blue s-blue" stroke-width="1.6"/><text x="105" y="72" text-anchor="middle" dominant-baseline="central" class="mono b c-blue">do</text><rect x="162" y="62" width="105" height="20" rx="4" class="f-amber s-amber" stroke-width="1"/><text x="275" y="72" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="mono">0.35×1</text><text x="40" y="123" text-anchor="middle" dominant-baseline="central" class="mono b c-violet">2</text><rect x="60" y="108" width="90" height="32" rx="5" class="f-blue s-blue" stroke-width="1.6"/><text x="105" y="124" text-anchor="middle" dominant-baseline="central" class="mono b c-blue">while</text><rect x="162" y="114" width="105" height="20" rx="4" class="f-amber s-amber" stroke-width="1"/><text x="275" y="124" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="mono">0.35×2</text><text x="40" y="175" text-anchor="middle" dominant-baseline="central" class="mono b c-violet">3</text><rect x="60" y="160" width="90" height="32" rx="5" class="f-blue s-blue" stroke-width="1.6"/><text x="105" y="176" text-anchor="middle" dominant-baseline="central" class="mono b c-blue">for</text><rect x="162" y="166" width="45" height="20" rx="4" class="f-amber s-amber" stroke-width="1"/><text x="215" y="176" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="mono">0.15×3</text><text x="40" y="227" text-anchor="middle" dominant-baseline="central" class="mono b c-violet">4</text><rect x="60" y="212" width="90" height="32" rx="5" class="f-blue s-blue" stroke-width="1.6"/><text x="105" y="228" text-anchor="middle" dominant-baseline="central" class="mono b c-blue">repeat</text><rect x="162" y="218" width="45" height="20" rx="4" class="f-amber s-amber" stroke-width="1"/><text x="215" y="228" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="mono">0.15×4</text><text x="175" y="280" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-green">ASL = 0.35+0.70+0.45+0.60 = 2.1</text><text x="175" y="302" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">概率大的放前面（交换论证）</text><rect x="350" y="8" width="380" height="314" rx="10" class="panel" stroke-width="1"/><text x="364" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">二叉链表：二叉排序树（中序必须有序）</text><path d="M561.1 171.5L547.2 200.5" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M506.6 93.6L484.5 126.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M535.7 93.6L557.8 126.4" class="ln" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="470" cy="148" r="26" class="f-blue s-blue" stroke-width="1.8"/><text x="470" y="148.5" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-blue">do</text><text x="396" y="148" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-blue">p=0.35·第2层</text><circle cx="536" cy="224" r="26" class="f-gray s-gray" stroke-width="1.8"/><text x="536" y="224.5" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-gray">repeat</text><text x="462" y="224" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="sub">p=0.15·第3层</text><circle cx="572.3" cy="148" r="26" class="f-blue s-blue" stroke-width="1.8"/><text x="572.3" y="148.5" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-blue">while</text><text x="646.3" y="148" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="b c-blue">p=0.35·第2层</text><circle cx="521.2" cy="72" r="26" class="f-gray s-gray" stroke-width="1.8"/><text x="521.2" y="72.5" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-gray">for</text><text x="595.2" y="72" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="sub">p=0.15·第1层</text><text x="540" y="280" text-anchor="middle" dominant-baseline="central" style="font-size:12.5px" class="mono b c-green">ASL = 0.15×1+0.35×2+0.35×2+0.15×3 = 2.0</text><text x="540" y="302" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">do &lt; for &lt; repeat &lt; while（字典序）</text></svg>
