<svg xmlns="http://www.w3.org/2000/svg" width="740" height="260" viewBox="0 0 740 260" role="img"><style>svg{--ink:#e6e7ea;--sub:#a9adb6;--mute:#6b7079;--line:#8a909b;--faint:#454a53;--surface:#26292f;--panel:#1d2025;--panel-line:#30343b;--blue:#60a5fa;--blue-bg:#1e3a6e;--blue-ink:#93c5fd;--green:#34d399;--green-bg:#0f4a3a;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-bg:#523a0c;--amber-ink:#fcd34d;--red:#f87171;--red-bg:#5c1d1d;--red-ink:#fca5a5;--violet:#a78bfa;--violet-bg:#3b2a6b;--violet-ink:#c4b5fd;--teal:#22d3ee;--teal-bg:#0e4452;--teal-ink:#67e8f9;--gray:#9ca3af;--gray-bg:#3a3e46;--gray-ink:#d1d5db}text{font-family:Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:14px;fill:var(--ink)}.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono',monospace}.it{font-style:italic;font-family:'Times New Roman','STIX Two Text',serif}.b{font-weight:600}.sub{fill:var(--sub)}.mute{fill:var(--mute)}.ln{stroke:var(--line);fill:none}.faint{stroke:var(--faint)}.surface{fill:var(--surface)}.panel{fill:var(--panel);stroke:var(--panel-line)}.box{fill:var(--surface);stroke:var(--line)}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 3}.ghost{opacity:.38}.ah-line{fill:var(--line)}.s-blue{stroke:var(--blue)}.f-blue{fill:var(--blue-bg)}.solid-blue{fill:var(--blue)}.c-blue{fill:var(--blue-ink)}.ah-blue{fill:var(--blue)}.s-green{stroke:var(--green)}.f-green{fill:var(--green-bg)}.solid-green{fill:var(--green)}.c-green{fill:var(--green-ink)}.ah-green{fill:var(--green)}.s-amber{stroke:var(--amber)}.f-amber{fill:var(--amber-bg)}.solid-amber{fill:var(--amber)}.c-amber{fill:var(--amber-ink)}.ah-amber{fill:var(--amber)}.s-red{stroke:var(--red)}.f-red{fill:var(--red-bg)}.solid-red{fill:var(--red)}.c-red{fill:var(--red-ink)}.ah-red{fill:var(--red)}.s-violet{stroke:var(--violet)}.f-violet{fill:var(--violet-bg)}.solid-violet{fill:var(--violet)}.c-violet{fill:var(--violet-ink)}.ah-violet{fill:var(--violet)}.s-teal{stroke:var(--teal)}.f-teal{fill:var(--teal-bg)}.solid-teal{fill:var(--teal)}.c-teal{fill:var(--teal-ink)}.ah-teal{fill:var(--teal)}.s-gray{stroke:var(--gray)}.f-gray{fill:var(--gray-bg)}.solid-gray{fill:var(--gray)}.c-gray{fill:var(--gray-ink)}.ah-gray{fill:var(--gray)}</style><defs></defs><rect x="10" y="8" width="350" height="244" rx="10" class="panel" stroke-width="1"/><text x="24" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">312 禁形：先最大、再最小、后居中</text><rect x="48" y="68" width="44" height="132" rx="5" class="f-red s-red" stroke-width="1.6"/><text x="70" y="216" text-anchor="middle" dominant-baseline="central" class="b c-red">Pᵢ</text><text x="70" y="56" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-red">大</text><rect x="138" y="156" width="44" height="44" rx="5" class="f-blue s-blue" stroke-width="1.6"/><text x="160" y="216" text-anchor="middle" dominant-baseline="central" class="b c-blue">Pⱼ</text><text x="160" y="144" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-blue">小</text><rect x="228" y="112" width="44" height="88" rx="5" class="f-amber s-amber" stroke-width="1.6"/><text x="250" y="216" text-anchor="middle" dominant-baseline="central" class="b c-amber">Pₖ</text><text x="250" y="100" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="b c-amber">中</text><text x="185" y="232" text-anchor="middle" dominant-baseline="central" style="font-size:12px" class="sub">出栈先后：i &lt; j &lt; k；数值：Pⱼ &lt; Pₖ &lt; Pᵢ</text><rect x="370" y="8" width="360" height="244" rx="10" class="panel" stroke-width="1"/><text x="384" y="26" text-anchor="start" dominant-baseline="central" style="font-size:13px" class="b sub">为什么不可能？</text><path d="M424 98L424 202L476 202L476 98" class="ln" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="428" y="169" width="44" height="30" rx="4" class="f-blue s-blue" stroke-width="1.6"/><text x="450" y="184" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-blue">b</text><rect x="428" y="137" width="44" height="30" rx="4" class="f-amber s-amber" stroke-width="1.6"/><text x="450" y="152" text-anchor="middle" dominant-baseline="central" style="font-size:13px" class="mono b c-amber">c</text><text x="450" y="222" text-anchor="middle" dominant-baseline="central" style="font-size:11.5px" class="sub">弹出 a 之后的栈</text><text x="510" y="70" text-anchor="start" dominant-baseline="central" style="font-size:12px">① 要先弹出最大的 a，</text><text x="510" y="90" text-anchor="start" dominant-baseline="central" style="font-size:12px">   比它小的 b、c 都已入栈</text><text x="510" y="116" text-anchor="start" dominant-baseline="central" style="font-size:12px">② b &lt; c，所以 b 先入栈、</text><text x="510" y="136" text-anchor="start" dominant-baseline="central" style="font-size:12px">   在 c 的下面</text><text x="510" y="162" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b c-red">③ 下一个要 b，但 c 挡在上面</text><text x="510" y="188" text-anchor="start" dominant-baseline="central" style="font-size:12px" class="b c-red">   ⇒ 序列不可能由栈得到</text></svg>
