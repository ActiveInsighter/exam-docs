name: Verify Exam Docs modal preview
on:
  push:
    branches:
      - 'codex/exam-modal-rootcause-preview-20261112'
permissions:
  contents: read
jobs:
  study-motion:
    name: Verify responsive spring motion in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout browser scripts and document path helper
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts
            lib/doc-paths.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Playwright driver
        env:
          QUESTION_BROWSER_MODULES: ${{ runner.temp }}/question-browser
        run: npm install --prefix "${QUESTION_BROWSER_MODULES}" --no-package-lock --no-audit --no-fund playwright-core@1.63.0
      - name: Verify full modal, study-card, mobile and reduced-motion interactions
        env:
          DEPLOYMENT_URL: https://exam-docs-preview.2212148739lbw.workers.dev
          QUESTION_BROWSER_MODULES: ${{ runner.temp }}/question-browser
          QUESTION_BROWSER_CHANNEL: chrome
          QUESTION_SCREENSHOTS: ${{ runner.temp }}/study-card-browser-screenshots
        run: node scripts/verify-study-motion-browser.mjs
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: study-card-browser-screenshots
          path: ${{ runner.temp }}/study-card-browser-screenshots
          if-no-files-found: ignore
          retention-days: 7
