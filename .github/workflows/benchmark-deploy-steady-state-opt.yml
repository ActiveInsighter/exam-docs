name: Benchmark steady-state deployment optimization

on:
  push:
    branches:
      - codex/deploy-steady-state-opt

concurrency:
  group: exam-docs-deploy-steady-state-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STATIC_DOCS_SHARD_COUNT: '4'
      STATIC_DOCS_SHARD_INDEX: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Refresh Fumadocs generated source
        run: npm run postinstall

      - name: Run deployment regression tests
        run: >-
          npm test --
          tests/deployment-workflows.test.ts
          tests/static-doc-shards.test.ts
          tests/static-build-id.test.ts
          tests/search-determinism.test.ts

      - name: Restore v4 shard cache
        uses: actions/cache@v5
        with:
          path: .static-docs-stage/.next/cache
          key: ${{ runner.os }}-static-shard-0-v4-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json', 'app/**', 'components/**', 'lib/**', 'scripts/**', 'content/docs/**') }}
          restore-keys: |
            ${{ runner.os }}-static-shard-0-v4-
            ${{ runner.os }}-static-shard-0-v3-
            ${{ runner.os }}-static-shard-0-v2-
            ${{ runner.os }}-static-shard-0-v1-
            ${{ runner.os }}-cloudflare-static-docs-turbopack-v1-
            ${{ runner.os }}-static-docs-turbopack-v4-

      - name: Build shard zero
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'shard0_wall=%e max_rss_kib=%M' npm run build:static-docs
          test -s .static-docs/search-index.json
          test "$(find .static-docs/docs -type f -name '*.md' | wc -l | tr -d ' ')" = '530'

      - name: Prime pinned Wrangler with dry-run
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'wrangler_first_wall=%e max_rss_kib=%M' \
            npx --yes wrangler@4.129.0 deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run-a

      - name: Measure same-job Wrangler reuse
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'wrangler_second_wall=%e max_rss_kib=%M' \
            npx --yes wrangler@4.129.0 deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run-b
