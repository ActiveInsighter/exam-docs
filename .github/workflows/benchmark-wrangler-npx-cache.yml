name: Benchmark Wrangler npx cache

on:
  push:
    branches:
      - codex/wrangler-cache-determinism

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run deployment workflow regression test
        run: npm test -- tests/deployment-workflows.test.ts

      - name: Restore pinned Wrangler npx install
        id: wrangler-cache
        uses: actions/cache@v5
        with:
          path: ~/.npm/_npx
          key: ${{ runner.os }}-node22-wrangler-npx-v1-4.129.0

      - name: Create representative static asset count
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .static-docs
          mkdir -p .static-docs/assets
          printf '<!doctype html><title>benchmark</title>\n' > .static-docs/index.html
          for i in $(seq 1 3671); do
            printf '%s\n' "${i}" > ".static-docs/assets/${i}.txt"
          done
          test "$(find .static-docs -type f | wc -l | tr -d ' ')" = '3672'

      - name: Benchmark pinned Wrangler dry-run
        shell: bash
        run: |
          set -euo pipefail
          echo "wrangler_cache_hit=${{ steps.wrangler-cache.outputs.cache-hit }}"
          /usr/bin/time -f 'wrangler_dry_run_wall=%e max_rss_kib=%M' \
            npx --yes wrangler@4.129.0 deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run
