name: Deploy exam-docs to Cloudflare

on:
  push:
    branches:
      - main
      - codex/static-chunk-union
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated static package to Cloudflare Workers Static Assets
        required: true
        default: true
        type: boolean

concurrency:
  group: exam-docs-cloudflare-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate static deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Refresh Fumadocs generated source
        run: npm run postinstall

      - name: Run static deployment tests
        run: >-
          npm test --
          tests/static-docs-build.test.ts
          tests/cloudflare-static-assets.test.ts
          tests/dedupe-static-rsc.test.ts
          tests/deployment-workflows.test.ts
          tests/static-doc-shards.test.ts
          tests/static-build-id.test.ts
          tests/search-determinism.test.ts
          tests/static-asset-references.test.ts

  build-shard:
    name: Static shard ${{ matrix.shard }} of 4
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STATIC_DOCS_SHARD_COUNT: '4'
      STATIC_DOCS_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Refresh Fumadocs generated source
        run: npm run postinstall

      - name: Restore shard Next/Turbopack cache
        uses: actions/cache@v5
        with:
          path: .static-docs-stage/.next/cache
          key: ${{ runner.os }}-static-shard-${{ matrix.shard }}-v4-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json', 'app/**', 'components/**', 'lib/**', 'scripts/**', 'content/docs/**') }}
          restore-keys: |
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v4-
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v3-
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v2-
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v1-
            ${{ runner.os }}-cloudflare-static-docs-turbopack-v1-
            ${{ runner.os }}-static-docs-turbopack-v4-

      - name: Build static shard
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v npm run build:static-docs

      - name: Validate shard output
        shell: bash
        run: |
          set -euo pipefail
          routes="$(find .static-docs/docs -type f -name index.html | wc -l | tr -d ' ')"
          files="$(find .static-docs -type f | wc -l | tr -d ' ')"
          bytes="$(du -sb .static-docs | awk '{print $1}')"
          echo "shard=${STATIC_DOCS_SHARD_INDEX}/4 routes=${routes} files=${files} bytes=${bytes}"
          if (( routes < 125 || routes > 140 )); then
            echo "::error::Unexpected route count ${routes} for shard ${STATIC_DOCS_SHARD_INDEX}."
            exit 1
          fi
          test -d .static-docs/_next/static
          if [[ "${STATIC_DOCS_SHARD_INDEX}" == '0' ]]; then
            test -s .static-docs/search-index.json
            markdown="$(find .static-docs/docs -type f -name '*.md' | wc -l | tr -d ' ')"
            test "${markdown}" = '530'
          else
            test ! -e .static-docs/search-index.json
            markdown="$(find .static-docs/docs -type f -name '*.md' | wc -l | tr -d ' ')"
            test "${markdown}" = '0'
          fi

      - name: Prepare merge payload
        shell: bash
        run: |
          set -euo pipefail
          payload="/tmp/static-shard-${STATIC_DOCS_SHARD_INDEX}.tar.zst"
          manifest="/tmp/static-chunks-${STATIC_DOCS_SHARD_INDEX}.sha256"

          find .static-docs/_next/static -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  .static-docs/#  #' > "${manifest}"

          if [[ "${STATIC_DOCS_SHARD_INDEX}" == '0' ]]; then
            tar --zstd -cf "${payload}" \
              --exclude='.static-docs/img' \
              .static-docs
          else
            tar --zstd -cf "${payload}" \
              --exclude='.static-docs/docs/index.html' \
              --exclude='.static-docs/docs/__next.docs.txt' \
              --exclude='*.md' \
              .static-docs/docs \
              .static-docs/_next/static
          fi

          ls -lh "${payload}" "${manifest}"

      - name: Upload shard payload
        uses: actions/upload-artifact@v4
        with:
          name: static-shard-${{ matrix.shard }}
          path: |
            /tmp/static-shard-${{ matrix.shard }}.tar.zst
            /tmp/static-chunks-${{ matrix.shard }}.sha256
          compression-level: 0
          retention-days: 1

  deploy:
    name: Merge and deploy Worker Static Assets
    needs: [validate, build-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download shard payloads
        uses: actions/download-artifact@v4
        with:
          pattern: static-shard-*
          path: /tmp/static-shards

      - name: Verify overlapping shared chunks are identical
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = Path('/tmp/static-shards')
          seen = {}
          owners = {}
          conflicts = []
          all_paths = set()
          intersections = None

          for shard in range(4):
              manifest = roots / f'static-shard-{shard}' / f'static-chunks-{shard}.sha256'
              current = set()
              for line in manifest.read_text().splitlines():
                  digest, rel = line.split('  ', 1)
                  current.add(rel)
                  all_paths.add(rel)
                  if rel in seen and seen[rel] != digest:
                      conflicts.append((rel, owners[rel], shard, seen[rel], digest))
                  else:
                      seen.setdefault(rel, digest)
                      owners.setdefault(rel, shard)
              intersections = current if intersections is None else intersections & current

          print(
              f'static_chunk_union={len(all_paths)} common_to_all={len(intersections or set())} '
              f'variant_paths={len(all_paths - (intersections or set()))}'
          )
          if conflicts:
              for rel, first, second, left, right in conflicts[:50]:
                  print(f'CONFLICT {rel}: shard {first}={left} shard {second}={right}')
              raise SystemExit('Two shards emitted different bytes at the same _next/static path.')
          PY

      - name: Merge static outputs with conflict checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .static-docs /tmp/shard-extract
          mkdir -p /tmp/shard-extract

          tar --zstd -xf /tmp/static-shards/static-shard-0/static-shard-0.tar.zst
          cp -a public/. .static-docs/

          for shard in 1 2 3; do
            rm -rf /tmp/shard-extract/*
            tar --zstd -xf "/tmp/static-shards/static-shard-${shard}/static-shard-${shard}.tar.zst" \
              -C /tmp/shard-extract
            SHARD_ROOT="/tmp/shard-extract/.static-docs" TARGET_ROOT="${PWD}/.static-docs" python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil

          source = Path(os.environ['SHARD_ROOT'])
          target = Path(os.environ['TARGET_ROOT'])
          conflicts = []
          copied = 0
          identical = 0

          def digest(path: Path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.digest()

          for src in source.rglob('*'):
              if not src.is_file():
                  continue
              rel = src.relative_to(source)
              dst = target / rel
              if dst.exists():
                  if digest(src) != digest(dst):
                      conflicts.append(str(rel))
                  else:
                      identical += 1
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied += 1

          print(f'copied={copied} identical={identical} conflicts={len(conflicts)}')
          if conflicts:
              print('\n'.join(conflicts[:50]))
              raise SystemExit('Shard merge produced conflicting files.')
          PY
          done

      - name: Validate merged package
        shell: bash
        run: |
          set -euo pipefail
          doc_routes="$(find .static-docs/docs -type f -name index.html | wc -l | tr -d ' ')"
          markdown="$(find .static-docs/docs -type f -name '*.md' | wc -l | tr -d ' ')"
          files="$(find .static-docs -type f | wc -l | tr -d ' ')"
          bytes="$(du -sb .static-docs | awk '{print $1}')"
          echo "merged_routes=${doc_routes} files=${files} markdown=${markdown} bytes=${bytes}"
          test "${doc_routes}" = '531'
          test "${markdown}" = '530'
          test -s .static-docs/docs/intro/index.html
          test -s .static-docs/docs/intro/__next._full.txt
          test -s .static-docs/docs/__next.docs.txt
          test ! -e .static-docs/docs/intro/__next.docs.txt
          test -s .static-docs/search-index.json
          test -s .static-docs/404.html
          node scripts/verify-static-asset-references.mjs .static-docs

      - name: Prepare Cloudflare Static Assets metadata
        run: npm run prepare:cloudflare-assets

      - name: Validate Cloudflare asset package
        shell: bash
        run: |
          set -euo pipefail

          test -s .static-docs/_redirects
          test -s .static-docs/.assetsignore
          test -s .static-docs/404.html
          grep -F '/docs/*/index.txt /docs/:splat/__next._full.txt 200' .static-docs/_redirects
          grep -F '/docs/*/__next.docs.txt /docs/__next.docs.txt 200' .static-docs/_redirects
          grep -Fx 'edgeone.json' .static-docs/.assetsignore

          file_count="$(find .static-docs -type f \
            ! -name 'edgeone.json' \
            ! -name '.assetsignore' \
            ! -name '_redirects' \
            | wc -l | tr -d ' ')"
          largest_bytes="$(find .static-docs -type f \
            ! -name 'edgeone.json' \
            ! -name '.assetsignore' \
            ! -name '_redirects' \
            -printf '%s\n' \
            | awk 'BEGIN { max = 0 } $1 > max { max = $1 } END { print max }')"

          if (( file_count > 20000 )); then
            echo "::error::Cloudflare Free Static Assets file limit exceeded: ${file_count}/20000."
            exit 1
          fi
          if (( largest_bytes > 25 * 1024 * 1024 )); then
            echo "::error::Cloudflare Static Assets 25 MiB single-file limit exceeded: ${largest_bytes} bytes."
            exit 1
          fi

          package_bytes="$(du -sb .static-docs | awk '{print $1}')"
          {
            echo '## Cloudflare Workers Static Assets validation'
            echo
            echo "- Uploadable asset files: ${file_count}/20000"
            echo "- Largest uploadable asset: $((largest_bytes / 1024 / 1024)) MiB / 25 MiB"
            echo "- Local static package: $((package_bytes / 1024 / 1024)) MiB"
            echo '- Static generation: 4 deterministic URL shards'
            echo '- Worker JavaScript: none (assets-only deployment)'
            echo '- RSC aliases: deduplicated locally and restored through two guarded Cloudflare 200 rewrites'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate Wrangler configuration with a dry run
        if: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy != true) }}
        run: npx --yes wrangler@4.129.0 deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run

      - name: Check Cloudflare deployment credentials
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo '::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN.'
            exit 1
          }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo '::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          }

      - name: Deploy to Cloudflare Workers Static Assets
        id: cloudflare-deploy
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deploy_log="$(mktemp)"
          trap 'rm -f -- "${deploy_log}"' EXIT
          npx --yes wrangler@4.129.0 deploy --config wrangler.jsonc | tee "${deploy_log}"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "${deploy_log}" | tail -n 1)"
          [[ -n "${deployment_url}" ]] || {
            echo '::error::Wrangler did not print a workers.dev deployment URL.'
            exit 1
          }
          echo "deployment-url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify Cloudflare deployment
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOYMENT_URL:-}" ]] || {
            echo '::error::Wrangler deploy did not return a deployment URL.'
            exit 1
          }
          base_url="${DEPLOYMENT_URL%/}"

          wait_for_route() {
            local path="$1"
            local status=''
            for attempt in $(seq 1 18); do
              status="$(curl --silent --show-error --max-time 60 -L -o /dev/null -w '%{http_code}' "${base_url}${path}")"
              echo "${path} attempt ${attempt}/18 -> ${status}"
              if [[ "${status}" == '200' ]]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Cloudflare route ${path} did not reach HTTP 200; last status ${status}."
            return 1
          }

          wait_for_route '/'
          for path in \
            '/docs/' \
            '/search-index.json' \
            '/docs/intro/' \
            '/docs/intro.md' \
            '/docs/intro/index.txt' \
            '/docs/intro/__next.docs.txt'; do
            wait_for_route "${path}"
          done

          route_list="$(mktemp)"
          encoded_route_list="$(mktemp)"
          route_failures="$(mktemp)"
          trap 'rm -f -- "${route_list}" "${encoded_route_list}" "${route_failures}"' EXIT

          find .static-docs/docs -type f -name index.html -print \
            | while IFS= read -r html_file; do
                relative="/${html_file#.static-docs/}"
                printf '%s\n' "${relative%/index.html}/"
              done > "${route_list}"

          node --input-type=module - "${route_list}" "${encoded_route_list}" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { encodeHttpPath } from './scripts/http-paths.mjs';

          const [inputPath, outputPath] = process.argv.slice(2);
          const encoded = readFileSync(inputPath, 'utf8')
            .split('\n')
            .filter(Boolean)
            .map(encodeHttpPath)
            .join('\n');
          writeFileSync(outputPath, `${encoded}\n`);
          NODE

          doc_route_count="$(wc -l < "${route_list}" | tr -d ' ')"
          export base_url route_failures
          if ! xargs -P 16 -n 1 bash -c '
            path="$1"
            status="$(curl --silent --show-error --max-time 60 -L -o /dev/null -w "%{http_code}" "${base_url}${path}")"
            if [[ "${status}" != "200" ]]; then
              printf "%s -> %s\n" "${path}" "${status}" >> "${route_failures}"
              exit 1
            fi
          ' _ < "${encoded_route_list}"; then
            echo '::error::One or more static documentation HTML routes failed.'
            sed -n '1,40p' "${route_failures}"
            exit 1
          fi

          echo "Full static documentation route verification: ${doc_route_count} routes -> 200"
          echo "- Cloudflare deployment: ${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
