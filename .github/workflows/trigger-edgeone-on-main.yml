name: Trigger EdgeOne deployment on main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger-edgeone:
    name: Dispatch existing EdgeOne workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch deploy-edgeone-docs.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GH_REPOSITORY}/actions/workflows/deploy-edgeone-docs.yml/dispatches" \
            -f ref=main
