name: Prepare latest stable dependencies
on:
  push:
    branches: [chore/stable-stack-20261026]
    paths: [.github/workflows/prepare-stable-upgrade.yml]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve latest published stable package versions
        run: |
          npx --yes npm-check-updates@latest -u --target latest
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate upgraded dependencies
        run: |
          npm test
          npm run typecheck
      - name: Commit only after validation succeeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "All packages are already on latest stable versions"
            exit 0
          fi
          git commit -m "chore(deps): update latest stable versions"
          git push origin HEAD:chore/stable-stack-20261026
