name: Temporary validate AI docs package

on:
  push:
    branches:
      - codex/ai-docs-artifact-after-deploy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Package real documentation tree
        run: node scripts/package-ai-docs.mjs "${RUNNER_TEMP}/exam-docs-ai"
      - name: Validate package manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const manifest = require(process.env.RUNNER_TEMP + '/exam-docs-ai/_manifest.json');
          console.log(JSON.stringify({
            documentCount: manifest.documentCount,
            sourceTreeFileCount: manifest.sourceTreeFileCount,
            referencedAssetCount: manifest.referencedAssetCount,
            missingAssets: manifest.missingAssets.length,
          }, null, 2));
          if (manifest.documentCount < 500) throw new Error('Unexpected document count');
          if (manifest.missingAssets.length !== 0) throw new Error('Missing assets found');
          NODE
      - name: Upload preview archive
        uses: actions/upload-artifact@v7
        with:
          name: ai-docs-preview-${{ github.sha }}
          path: ${{ runner.temp }}/exam-docs-ai
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
