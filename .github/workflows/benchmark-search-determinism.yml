name: Benchmark search output determinism

on:
  push:
    branches:
      - codex/search-output-determinism

permissions:
  contents: read

jobs:
  compare:
    name: Compare two search builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Refresh Fumadocs generated source
        run: npm run postinstall

      - name: Build search twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/search-a /tmp/search-b
          mkdir -p /tmp/search-a /tmp/search-b
          /usr/bin/time -f 'search_a_wall=%e max_rss_kib=%M' node scripts/build-search-index.mjs /tmp/search-a/search-index.json
          /usr/bin/time -f 'search_b_wall=%e max_rss_kib=%M' node scripts/build-search-index.mjs /tmp/search-b/search-index.json

      - name: Compare search output semantically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import json, re

          roots = [Path('/tmp/search-a'), Path('/tmp/search-b')]

          def load(root, url):
              return json.loads((root / url.lstrip('/')).read_text())

          def normalize_url(value):
              if not isinstance(value, str):
                  return value
              return re.sub(r'-[0-9a-f]{12}(?=\.json$)', '-<digest>', value)

          def normalize(value):
              if isinstance(value, dict):
                  return {k: normalize(v) for k, v in sorted(value.items())}
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              return normalize_url(value)

          manifests = [json.loads((root / 'search-index.json').read_text()) for root in roots]
          print('manifest_equal_raw=', manifests[0] == manifests[1])
          print('manifest_equal_without_digests=', normalize(manifests[0]) == normalize(manifests[1]))

          categories = []
          by_id = [{c['id']: c for c in manifest['categories']} for manifest in manifests]
          if set(by_id[0]) != set(by_id[1]):
              raise SystemExit(f'category sets differ: {set(by_id[0]) ^ set(by_id[1])}')

          pairs = []
          router_semantic_changes = 0
          for category in sorted(by_id[0]):
              ca, cb = by_id[0][category], by_id[1][category]
              ra, rb = load(roots[0], ca['router']['url']), load(roots[1], cb['router']['url'])
              if normalize(ra) != normalize(rb):
                  router_semantic_changes += 1

              for kind in ('core', 'body'):
                  ga, gb = defaultdict(list), defaultdict(list)
                  for shard in ra[kind]:
                      ga[(shard['group'], shard['records'])].append(shard)
                  for shard in rb[kind]:
                      gb[(shard['group'], shard['records'])].append(shard)
                  if set(ga) != set(gb):
                      raise SystemExit(f'{category}/{kind} descriptor groups differ')
                  for key in sorted(ga):
                      la = sorted(ga[key], key=lambda item: normalize_url(item['url']))
                      lb = sorted(gb[key], key=lambda item: normalize_url(item['url']))
                      if len(la) != len(lb):
                          raise SystemExit(f'{category}/{kind}/{key} shard counts differ')
                      for index, (sa, sb) in enumerate(zip(la, lb)):
                          pairs.append((f'{category}/{kind}/{key}/{index}', sa['url'], sb['url']))

          raw_changed = semantic_changed = canonical_changed = 0
          for label, ua, ub in pairs:
              pa = roots[0] / ua.lstrip('/')
              pb = roots[1] / ub.lstrip('/')
              ba, bb = pa.read_bytes(), pb.read_bytes()
              if ba != bb:
                  raw_changed += 1
              ja, jb = json.loads(ba), json.loads(bb)
              if ja != jb:
                  semantic_changed += 1
                  if semantic_changed <= 8:
                      print(f'SEMANTIC_CHANGED {label}')
                      if isinstance(ja, dict) and isinstance(jb, dict):
                          print(' keys=', sorted(set(ja) | set(jb)))
                          for key in sorted(set(ja) & set(jb)):
                              if ja[key] != jb[key]:
                                  print(' first_top_level_diff=', key)
                                  print('  a=', repr(ja[key])[:1200])
                                  print('  b=', repr(jb[key])[:1200])
                                  break
              ca = json.dumps(ja, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              cb = json.dumps(jb, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              if ca != cb:
                  canonical_changed += 1

          print(f'paired_search_shards={len(pairs)}')
          print(f'router_semantic_changes_without_digests={router_semantic_changes}')
          print(f'raw_changed={raw_changed} semantic_changed={semantic_changed} canonical_changed={canonical_changed}')
          PY
